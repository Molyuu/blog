[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Keep in sync with the local Node major; Astro requires >= 22.23.4
  NODE_VERSION = "26"

# Old Hexo permalinks (as served on blog.molyuu.com before the migration)
[[redirects]]
  from = "/2023/08/04/Hello-Internet/"
  to = "/blog/hello-internet/"
  status = 301

[[redirects]]
  from = "/2023/08/21/Neovim-From-Zero-to-One/"
  to = "/blog/neovim-from-zero-to-one/"
  status = 301

[[redirects]]
  from = "/2023/08/22/CSP-JS1-Basic/"
  to = "/blog/csp-js1-basic/"
  status = 301

[[redirects]]
  from = "/2023/09/16/CSP-S1-2023/"
  to = "/blog/csp-s1-2023/"
  status = 301

[[redirects]]
  from = "/2023/12/31/Molyuu-Disorder/"
  to = "/blog/molyuu-disorder/"
  status = 301

# Category pages were removed; send old links to the full post list.
[[redirects]]
  from = "/category/*"
  to = "/blog/"
  status = 301

# Tools that fetch /favicon.ico directly (feed readers, bookmarks) get the
# GitHub avatar too. 302 so a new avatar shows up without stale caches.
[[redirects]]
  from = "/favicon.ico"
  to = "https://avatars.githubusercontent.com/u/102394810?s=64"
  status = 302
